<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8d8c7"/>
      <stop offset="0.55" stop-color="#efc1ae"/>
      <stop offset="1" stop-color="#d99c88"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c1f1a"/>
      <stop offset="0.55" stop-color="#4b3228"/>
      <stop offset="1" stop-color="#1c1512"/>
    </linearGradient>
    <linearGradient id="blouse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1ece4"/>
      <stop offset="0.55" stop-color="#ddd4c7"/>
      <stop offset="1" stop-color="#c8bcae"/>
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eee9df"/>
      <stop offset="1" stop-color="#d8d0c4"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6b39d"/>
      <stop offset="0.6" stop-color="#a58f79"/>
      <stop offset="1" stop-color="#8f7865"/>
    </linearGradient>
    <linearGradient id="shoe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c7b7"/>
      <stop offset="1" stop-color="#ab9380"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#7d6d61" flood-opacity="0.22"/>
    </filter>
  </defs>

  <ellipse cx="520" cy="1415" rx="250" ry="34" fill="#8a7769" opacity="0.12" filter="url(#soft)"/>

